
services:

  nginx:
    build:
      context: .
      target: nginx
    networks:
      - all
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx:/etc/nginx/templates

  frontend-dev:
    build:
      context: .
      target: debian-frontend-dev
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - all
    volumes:
      - ./src:/opt/simple-radio/src
      # this ensures stations json file persists across restarts
      - simple_radio_data_public:/opt/simple-radio/public
      
  frontend-prod:
    extends:
      service: nginx

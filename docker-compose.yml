
services:

  frontend:
    container_name: simple_radio_frontend
    extends:
      file: common.yml
      service: "frontend-${ENV:-dev}"
    restart: always

  api:
    container_name: simple_radio_api
    build:
      context: .
      target: debian-src
    command: "api"
    environment:
      SIMPLE_RADIO_DB: "/opt/simple-radio-data/simple_radio.db"
      ENV: "${ENV:-dev}"
    networks:
     - all
    ports:
      - "127.0.0.1:3001:8000"
    restart: always
    volumes:
      - ./api:/opt/simple-radio/api
      - simple_radio_data:/opt/simple-radio-data

networks:
  all:

volumes:
  simple_radio_data:
    name: simple_radio_data
  simple_radio_data_public:
    name: simple_radio_data_public
